name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/cleanup-reviewed-branches.yml]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const {owner, repo} = context.repo;
            const keep = {
              main: context.sha,
              design_review_1: '28e3c1114d4984cd8f6888d6509e786220378dfc',
              design_review_2: '0818d5f8d65c6bd1c25f599b13a52347e6589f04'
            };
            const remove = {
              'main-ci-results': 'abb4e0701879545b936591eadc224eff3bbdcb36',
              'power-rail-improvements': '5a57736cd199f0af65d47b5e2a0245483fdb0120',
              'power-rail-improvements-ci-results': '6937c346463f84cb1e04d344ef5d84e1a625ed05',
              'power-rail-improvements-reviewed-release': '591b853762ae3488d187c0941985505781e52cc8',
              'power-rail-review-evidence': '91f91d2790787b5433cac2caa9c33a3762611421'
            };
            const expected = {...keep, ...remove};
            const before = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            if (before.length !== Object.keys(expected).length) throw new Error('Branch inventory changed; inspect before deleting.');
            for (const branch of before) {
              if (expected[branch.name] !== branch.commit.sha) throw new Error('Branch moved: ' + branch.name);
            }
            const pr = (await github.rest.pulls.get({owner, repo, pull_number: 7})).data;
            if (!pr.merged || pr.head.sha !== remove['power-rail-improvements']) throw new Error('Power-rail PR is not the expected merged revision.');
            for (const [name, sha] of Object.entries(remove)) {
              const current = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + name})).data;
              if (current.object.sha !== sha) throw new Error('Branch moved before deletion: ' + name);
              await github.rest.git.deleteRef({owner, repo, ref: 'heads/' + name});
              core.info('Deleted ' + name);
            }
            const after = await github.paginate(github.rest.repos.listBranches, {owner, repo, per_page: 100});
            if (after.length !== 3 || after.some(b => keep[b.name] !== b.commit.sha)) throw new Error('Unexpected final branch inventory.');
            core.info('Retained only: ' + after.map(b => b.name).join(', '));
            await core.summary.addHeading('Branch cleanup completed').addList(after.map(b => b.name + ': ' + b.commit.sha)).write();
