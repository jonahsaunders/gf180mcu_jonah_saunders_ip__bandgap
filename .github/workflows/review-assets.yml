name: Validate and package reviewed layout assets
# Retain finite DC results and all noise diagnostics even if a noise model fails.
on:
  push:
    branches: [power-rail-improvements]
    paths: [.github/workflows/review-assets.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: 91f91d2790787b5433cac2caa9c33a3762611421
          path: review-input
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install geometry and plotting dependencies
        run: python -m pip install klayout==0.30.9 numpy==2.2.6 matplotlib==3.10.3
      - name: Restore and authenticate checked evidence
        run: |
          python - <<'PY'
          import gzip, hashlib, json
          from pathlib import Path
          root = Path('review-input')
          status = json.loads((root/'ci_status.json').read_text())
          assert status['commit'] == '0268fc2f1b5e7ac12ccda2263d9621e33fe40c39', status
          assert status['flow_outcome'] == status['extract_outcome'] == status['screens_outcome'] == 'success'
          for p in root.rglob('*.gz'):
              if 'review-package' not in p.parts:
                  p.with_suffix('').write_bytes(gzip.decompress(p.read_bytes()))
          for base in [root, root/'baseline']:
              v = json.loads((base/'verification.json').read_text())
              assert v['drc_violations'] == 0 and v['lvs_match'] and v['expanded_device_units'] == 533
              for name, expected in v['sha256'].items():
                  assert hashlib.sha256((base/name).read_bytes()).hexdigest() == expected, name
          review = json.loads((root/'power_review/comparison.json').read_text())
          assert len(review['nominal']) == 10 and len(review['pvt']) == 360 and len(review['additional_screens']) == 12
          PY
      - name: Rerun noise with its supported solver
        env:
          IMAGE: hpretl/iic-osic-tools@sha256:5d6adf1f437cd0f2f8f8614488ec3c247ba8c768f4663a25d5e997b30ccb13b0
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          docker pull "$IMAGE"
          chmod -R a+rwX review-input
          docker run --rm --network none --mount type=bind,source="$PWD",target=/design --entrypoint /bin/bash "$IMAGE" -lc 'source /foss/tools/sak/sak-pdk-script.sh gf180mcuD >/dev/null && OMP_NUM_THREADS=1 python3 /design/layout/scripts/retry_power_review_noise.py /design/review-input'
      - name: Verify baseline geometry and regenerate the 3D model
        run: |
          python layout/scripts/compare_layouts.py layout/release/Bandgap_Core_Res.gds review-input/baseline/filled_candidate.gds --out review-input/power_review/baseline_rebuild_equivalence.json
          python layout/scripts/render_layout_3d.py --gds review-input/filled_candidate.gds --out review-input/model
          python layout/scripts/package_power_review.py --build review-input --output /tmp/reviewed-release
      - name: Check published hashes and GLB structure
        run: |
          python - <<'PY'
          import hashlib, json, struct
          from pathlib import Path
          import numpy as np
          root = Path('/tmp/reviewed-release')
          v = json.loads((root/'verification.json').read_text())
          for name, expected in v['sha256'].items():
              assert hashlib.sha256((root/name).read_bytes()).hexdigest() == expected, name
          p = json.loads((root/'model/provenance.json').read_text())
          assert p['source_gds_sha256'] == v['sha256']['Bandgap_Core_Res.gds']
          raw = (root/'model/bandgap-layout.glb').read_bytes()
          magic, version, size = struct.unpack_from('<III', raw)
          assert magic == 0x46546c67 and version == 2 and size == len(raw)
          length, kind = struct.unpack_from('<II', raw, 12)
          assert kind == 0x4e4f534a
          gltf = json.loads(raw[20:20+length])
          binary_start = 20+length+8
          assert len(gltf['meshes']) == len(gltf['nodes']) == 14
          for mesh in gltf['meshes']:
              prim = mesh['primitives'][0]
              a = gltf['accessors'][prim['attributes']['POSITION']]
              view = gltf['bufferViews'][a['bufferView']]
              vertices = np.frombuffer(raw, dtype='<f4', count=a['count']*3, offset=binary_start+view['byteOffset']).reshape(-1,3)
              assert np.isfinite(vertices).all()
              aidx = gltf['accessors'][prim['indices']]
              iview = gltf['bufferViews'][aidx['bufferView']]
              indices = np.frombuffer(raw, dtype='<u4', count=aidx['count'], offset=binary_start+iview['byteOffset'])
              assert len(indices)%3 == 0 and indices.max() < len(vertices)
          print('All release hashes, 14 meshes, vertices and triangle indices verified.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-power-rail-release
          path: /tmp/reviewed-release
          retention-days: 90
      - name: Preserve reviewed release objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd /tmp/reviewed-release
          git init -q
          git checkout -q -b release
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m 'Verified power-rail release and GDS-derived 3D model'
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" release:refs/heads/power-rail-improvements-reviewed-release
